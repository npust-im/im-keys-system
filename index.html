<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>教室鑰匙・設備借用</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">

    <header class="site-head">
      <a href="admin.html" class="head-gear" title="系辦後台" aria-label="系辦後台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
      <img src="logo.svg" alt="工業管理系" class="site-logo" />
      <div class="brandbar"></div>
      <h1 style="font-size:22px;margin-top:10px">鑰匙・設備借用登記</h1>
    </header>

    <!-- 步驟圓點 -->
    <div id="stepdots" class="stepdots hidden">
      <span class="sd active" data-step="1"><span class="dot2">1</span><span class="lbl2">借用人</span></span>
      <span class="bar2"></span>
      <span class="sd" data-step="2"><span class="dot2">2</span><span class="lbl2">借用項目</span></span>
      <span class="bar2"></span>
      <span class="sd" data-step="3"><span class="dot2">3</span><span class="lbl2">送出</span></span>
    </div>

    <div id="loading" class="card center">
      <p>資料載入中…</p>
    </div>

    <div id="form" class="hidden">

      <section class="card">
        <label class="field">
          <span class="lbl">學號</span>
          <div class="combo">
            <input id="sid" type="search" inputmode="numeric" autocomplete="off" placeholder="輸入學號" />
            <div id="suggest" class="suggest hidden"></div>
          </div>
        </label>
        <label class="field">
          <span class="lbl">姓名</span>
          <input id="sname" type="text" disabled placeholder="—" />
        </label>
        <label class="field" style="margin-bottom:0">
          <span class="lbl">身分證後 3 碼</span>
          <input id="sid3" type="text" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="輸入 3 位數字" />
        </label>
      </section>

      <section class="card">
        <h2 style="font-size:18px" class="mb16">請選擇借用項目</h2>
        <div class="chips">
          <button type="button" id="wantKey" class="chip">借鑰匙</button>
          <button type="button" id="wantEq" class="chip">借設備</button>
        </div>
        <p class="hint">請至少選一項。點選後下方才會出現對應清單。</p>
      </section>

      <section class="card hidden" id="keySection">
        <h2 style="font-size:18px" class="mb16">借用鑰匙</h2>
        <div id="keyChips" class="chips"></div>
        <div class="row mt16">
          <input id="newKey" type="text" placeholder="找不到教室？在此新增（例：CM520）" />
          <button id="addKeyBtn" class="btn btn-ghost btn-sm" style="white-space:nowrap">新增教室</button>
        </div>
        <p id="keyMsg" class="hint"></p>
      </section>

      <section class="card hidden" id="eqSection">
        <h2 style="font-size:18px" class="mb16">借用設備</h2>
        <div id="eqList"></div>
        <div class="row mt16">
          <input id="newEq" type="text" placeholder="找不到設備？在此新增（例：白板筆）" />
          <button id="addEqBtn" class="btn btn-ghost btn-sm" style="white-space:nowrap">新增設備</button>
        </div>
        <p id="eqMsg" class="hint"></p>
      </section>

      <section class="card sticky-submit">
        <div class="row-between mb16">
          <span class="lbl" style="margin:0">借出時間</span>
          <span id="clock" class="mono strong"></span>
        </div>
        <div id="submitMsg"></div>
        <button id="submitBtn" class="btn btn-brass btn-block">送出借用登記</button>
      </section>
    </div>

    <div id="done" class="hidden">
      <section class="card center">
        <div class="checkcircle">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--returned)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <h2 style="font-size:22px;margin-top:8px">已送出借用登記</h2>
        <div id="doneSummary" class="msg msg-ok mt16" style="text-align:left"></div>
        <p class="small">請到系辦領取鑰匙 / 設備。歸還時由系辦工讀生於後台確認。</p>
        <button id="againBtn" class="btn btn-ghost mt16">再登記一筆</button>
      </section>
    </div>
  </div>

  <script type="module" src="js/student.js"></script>
</body>
</html>
